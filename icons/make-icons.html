<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<script>
const sizes = [16, 32, 48, 128];

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  const r = Math.round(size * 0.18);

  // Background
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = '#6c63ff';
  ctx.fill();

  // White card
  const cx = size * 0.18, cy = size * 0.22;
  const cw = size * 0.64, ch = size * 0.62;
  const cr = size * 0.07;
  ctx.beginPath();
  ctx.moveTo(cx + cr, cy);
  ctx.lineTo(cx + cw - cr, cy);
  ctx.quadraticCurveTo(cx + cw, cy, cx + cw, cy + cr);
  ctx.lineTo(cx + cw, cy + ch - cr);
  ctx.quadraticCurveTo(cx + cw, cy + ch, cx + cw - cr, cy + ch);
  ctx.lineTo(cx + cr, cy + ch);
  ctx.quadraticCurveTo(cx, cy + ch, cx, cy + ch - cr);
  ctx.lineTo(cx, cy + cr);
  ctx.quadraticCurveTo(cx, cy, cx + cr, cy);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fill();

  // Top clip indicator
  const tw = size * 0.32, th = size * 0.1;
  const tx = (size - tw) / 2, ty = size * 0.15;
  ctx.beginPath();
  ctx.roundRect(tx, ty, tw, th, size * 0.05);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.fill();

  // Lines
  const lx = size * 0.27, lw1 = size * 0.46, lw2 = size * 0.34, lw3 = size * 0.40;
  const lh = Math.max(2, size * 0.055), lr = lh / 2;
  const ly1 = size * 0.37, ly2 = size * 0.5, ly3 = size * 0.63;

  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.roundRect(lx, ly1, lw1, lh, lr); ctx.fill();
  ctx.beginPath(); ctx.roundRect(lx, ly2, lw2, lh, lr); ctx.fill();
  ctx.beginPath(); ctx.roundRect(lx, ly3, lw3, lh, lr); ctx.fill();

  return canvas.toDataURL('image/png');
}

sizes.forEach(size => {
  const dataUrl = drawIcon(size);
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `icon${size}.png`;
  a.textContent = `Download icon${size}.png`;
  a.style.display = 'block';
  a.style.margin = '8px';
  document.body.appendChild(a);

  // Auto-download
  a.click();
});
</script>
</body>
</html>
